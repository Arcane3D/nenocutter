name: Unpublish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the Pages site
        env:
          TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-delete.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "status:$code"
          cat /tmp/pages-delete.json
          echo
          if [ "$code" != "204" ] && [ "$code" != "404" ]; then
            exit 1
          fi
